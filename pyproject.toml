[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-advisor"
version = "0.1.0"
description = "Fusion advisor for PyTorch models: torch.fx analysis, Triton codegen, source-mapped diffs."
readme = "README.md"
requires-python = ">=3.12"  # typing.override (PEP 698)
keywords = ["pytorch", "triton", "torch-fx", "kernel-fusion", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "torch>=2.4",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
gpu = ["triton>=3.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "tabulate",  # torch.fx Graph.print_tabular() -- used by playground/
]

[project.scripts]
fusion-advisor = "fusion_advisor.cli:main"

[project.urls]
Homepage = "https://github.com/ketjandr/fusion-advisor"
Repository = "https://github.com/ketjandr/fusion-advisor"
Issues = "https://github.com/ketjandr/fusion-advisor/issues"

[tool.hatch.build.targets.wheel]
packages = ["fusion_advisor"]

[tool.hatch.build.targets.sdist]
include = [
    "/fusion_advisor",
    "/examples",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU and Triton"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# PLR0402 wants `from torch import nn`. `import torch.nn as nn` is the universal
# PyTorch idiom and what every reader of this codebase will expect.
ignore = ["PLR0402"]
